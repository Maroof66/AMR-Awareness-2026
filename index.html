<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#d8f0ed">
  <meta name="description" content="An interactive public-awareness story about antibiotic resistance.">
  <title>Antibiotic Resistance | An Interactive Story</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/animations.css">
</head>
<body>
  <div class="ambient ambient--one"></div>
  <div class="ambient ambient--two"></div>

  <div id="experience">
    <header class="topbar">
      <div class="brand"><span class="brand__dot"></span><span data-i18n="brand">ANTIBIOTIC RESISTANCE</span></div>
      <span class="counter" id="counter">INTRO</span>
    </header>

    <div class="progress" role="progressbar" aria-label="Story progress"
         aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="progressTrack">
      <div class="progress__fill" id="progressFill"></div>
    </div>

    <main class="scene" id="scene">
      <section class="scene__art" aria-label="Illustration">
        <div class="art-orbit art-orbit--one"></div>
        <div class="art-orbit art-orbit--two"></div>
        <div class="art-spark art-spark--one">✦</div>
        <div class="art-spark art-spark--two">✧</div>
        <img class="character" src="assets/characters/main-character.svg"
             alt="A friendly woman holding a tablet and a glass of water">
        <div class="art-note" aria-hidden="true">
          <span class="art-note__check">✓</span>
          <span class="art-note__line"></span>
        </div>
      </section>

      <section class="scene__copy">
        <p class="eyebrow" data-i18n="eyebrow">A SHORT INTERACTIVE STORY</p>
        <h1 id="title">A small habit.<br>A bigger consequence.</h1>
        <p class="description" id="description">
          We often take antibiotics without thinking twice. But what happens when we use them when they aren't needed?
        </p>
      </section>
    </main>

    <footer class="controls">
      <span class="controls__hint" data-i18n="hint">Take a moment. Watch what happens.</span>
      <button id="nextButton" type="button">
        <span data-i18n="start">Start the story</span><span aria-hidden="true">→</span>
      </button>
    </footer>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
