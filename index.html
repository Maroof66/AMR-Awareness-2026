<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#e8f5f2">
  <meta name="description" content="An interactive animated story about antibiotic resistance.">
  <title>One Small Habit — An AMR Story</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/motion.css">
</head>
<body>
  <main id="experience">
    <header class="topbar">
      <div class="brand"><span class="brand-mark"></span><span data-i18n="brand">AWARENESS / ANTIBIOTIC RESISTANCE</span></div>
      <div class="chapter" id="chapter">THE EVERYDAY HABIT</div>
    </header>

    <div class="progress-track" role="progressbar" aria-label="Story progress"
         aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="progressTrack">
      <div class="progress-value" id="progressValue"></div>
    </div>

    <section class="stage-wrap" aria-label="Animated story">
      <div class="stage" id="stage">
        <div class="stage-loading">Preparing the story…</div>
      </div>
      <div class="scene-caption" aria-live="polite">
        <div class="caption-kicker" id="kicker">A SHORT INTERACTIVE STORY</div>
        <h1 id="headline">A small habit.<br>A bigger consequence.</h1>
        <p id="bodycopy">Sometimes, when we feel unwell, we reach for antibiotics without checking whether we need them.</p>
      </div>
    </section>

    <footer class="controls">
      <div class="control-note" id="controlNote">Tap next to follow the story</div>
      <button id="nextButton" type="button"><span id="buttonText">Begin</span><span class="button-arrow">→</span></button>
    </footer>
  </main>
  <script type="module" src="js/app.js"></script>
</body>
</html>
