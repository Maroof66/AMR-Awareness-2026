<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" preserveAspectRatio="xMidYMid meet">
<defs>
 <linearGradient id="wall" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#c8ece8"/><stop offset="1" stop-color="#a9ded9"/></linearGradient>
 <linearGradient id="jacket" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#078f8a"/><stop offset="1" stop-color="#006e72"/></linearGradient>
 <linearGradient id="skin" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffad91"/><stop offset="1" stop-color="#f18e79"/></linearGradient>
 <linearGradient id="blood" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#193f56"/><stop offset="1" stop-color="#102d45"/></linearGradient>
 <filter id="blur"><feGaussianBlur stdDeviation="18"/></filter>
</defs>
<!-- Camera viewport: room, character and microscopic cutaway live in one coordinate space -->
<g id="camera-frame">
 <g id="room">
  <rect width="1440" height="900" fill="url(#wall)"/>
  <rect x="0" y="0" width="470" height="650" fill="#72c7c4"/>
  <rect x="485" y="0" width="30" height="900" fill="#fff"/>
  <rect x="0" y="650" width="1440" height="250" fill="#b7e4df"/>
  <rect x="1020" y="0" width="270" height="270" fill="#8bd9d3"/>
  <rect x="1060" y="0" width="190" height="205" fill="#bdf3ef"/>
  <path d="M0 780h1440" stroke="#fff" stroke-width="12"/>
  <rect x="75" y="370" width="210" height="270" fill="#159c9c" opacity=".8"/>
  <rect x="1150" y="520" width="180" height="195" fill="#348f91"/>
  <path d="M1150 715h180" stroke="#176b70" stroke-width="8"/>
  <g fill="#f5a34d"><circle cx="1090" cy="330" r="48"/><path d="m1068 331 16 17 31-39" fill="none" stroke="#fff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/></g>
  <g opacity=".6" fill="#159b98"><rect x="120" y="420" width="20" height="20"/><rect x="185" y="420" width="20" height="20"/><rect x="120" y="485" width="20" height="20"/></g>
  <path d="M1170 520h130l-10-160h-110z" fill="#338e91"/>
  <path d="M1235 520v150m-35 0h70" stroke="#fff" stroke-width="10" stroke-linecap="round"/>
 </g>

 <!-- Character silhouette and layered pose, inspired by the supplied reference -->
 <g id="character">
  <!-- Hair behind shoulders -->
  <path d="M530 310c-22-125 35-234 159-247 112-12 192 69 182 177-4 45 27 75 43 113 16 41-5 89-39 112l-365-3c-41-34-44-96 20-152z" fill="#b86c55"/>
  <path d="M563 240c-55 43-72 111-43 167-33 35-39 74-12 107l78 8 25-118z" fill="#a95f4d"/>
  <path d="M820 232c55 43 62 98 31 144 42 29 56 67 31 102l-76 22-35-123z" fill="#a95f4d"/>
  <!-- Torso -->
  <path d="M430 900c-4-206 13-336 63-412 38-58 103-84 176-91l101 25c97-4 169 31 203 104 36 78 51 224 67 374z" fill="url(#jacket)"/>
  <path d="M612 414l76-16 68 20 91 482H590z" fill="#39bcb5"/>
  <path d="M566 410c-75 31-103 107-116 210l-37 202c-8 52 16 90 57 98 41 8 76-10 100-42l103-119-29-70-86 72 28-213z" fill="#087f7d"/>
  <path d="M778 412c72-12 135 21 160 91l68 230c15 51-3 98-44 116-42 18-87-2-109-40l-72-132 24-75-53-132z" fill="#087f7d"/>
  <path d="M563 429l44 190-42 28m208-221 82 279" fill="none" stroke="#064f52" stroke-width="6" stroke-linecap="round"/>
  <path d="M666 405l54 42 49-42" fill="none" stroke="#d7f5ed" stroke-width="8"/>
  <!-- Neck -->
  <path d="M646 333l-4 91c28 44 92 47 123 5l-19-111z" fill="url(#skin)"/>
  <!-- Face -->
  <g id="head">
   <path d="M564 205c7-94 76-143 161-128 80 14 111 74 96 165l-18 93c-13 64-62 104-122 95-68-10-111-70-108-140z" fill="url(#skin)"/>
   <path d="M562 270c-31-21-54 8-39 39 12 26 33 34 49 16" fill="#f49a80"/>
   <path d="M554 237c-11-104 37-184 134-192 88-7 149 48 153 126-22-34-49-45-76-81-45 52-122 94-211 111z" fill="#b86c55"/>
   <path d="M830 193c34 48 17 101-3 126l-14 76c-8 26-25 44-47 53 32-59 23-97 5-128-16-27-24-55-21-91z" fill="#a95f4d"/>
   <path d="M579 187c36-10 77-38 108-71m30-20 56 32" fill="none" stroke="#7f493d" stroke-width="6" stroke-linecap="round"/>
   <path d="M624 221q27-19 49-8m69-8q19-13 37 1" fill="none" stroke="#a75e4c" stroke-width="8" stroke-linecap="round"/>
   <g id="blink" fill="#54291f"><ellipse cx="646" cy="250" rx="9" ry="13"/><ellipse cx="737" cy="244" rx="8" ry="12"/></g>
   <path d="M704 253q15 26-5 38" fill="none" stroke="#d87561" stroke-width="5" stroke-linecap="round"/>
   <path d="M670 312q27 21 53-3-4 31-28 32-19-1-25-29z" fill="#fff"/>
   <path d="M591 271l14 37" stroke="#d87561" stroke-width="5" stroke-linecap="round"/>
  </g>
  <!-- Left hand holding water glass -->
  <path d="M542 644c34-31 74-45 122-49l60-4c22-1 27 18 7 28l-51 21 57-4c22-1 27 18 7 28l-57 22 40 4c18 2 20 20 0 27l-62 19-53 49-69-68z" fill="url(#skin)"/>
  <!-- Glass -->
  <g id="water">
   <path d="M633 566h132l-16 187c-2 22-19 32-49 32h-7c-31 0-48-10-50-32z" fill="#fff"/>
   <path d="M640 644q61 22 118 0l-12 99q-3 20-49 20-45 0-48-20z" fill="#a9eee5"/>
   <path d="M635 567q65 29 128 0" fill="none" stroke="#62bcb4" stroke-width="6"/>
  </g>
  <!-- Right arm lifted with pill -->
  <g id="right-arm">
   <path d="M878 604c-28-49-42-104-32-146 6-27 24-49 44-68l31-35c12-13 28-5 23 12l-14 39 34-55c11-17 29-7 22 10l-18 51 31-37c13-14 29 0 19 16l-27 47 23-19c14-11 27 5 17 20l-40 72-32 91z" fill="url(#skin)"/>
   <path d="M897 425c18 27 20 52 5 76" fill="none" stroke="#d87561" stroke-width="5" stroke-linecap="round"/>
   <path d="M889 598l-10 69 116-2-25-75z" fill="#087e7d"/>
   <path d="M912 610v22m48-21 2 22" stroke="#064f52" stroke-width="5" stroke-linecap="round"/>
  </g>
  <g id="pill" transform="translate(948 333) rotate(24)">
   <rect x="-16" y="-38" width="32" height="76" rx="16" fill="#fff"/>
   <path d="M-15 0h30" stroke="#168d88" stroke-width="5"/>
  </g>
  <!-- Floating packet and time cue -->
  <g id="packet" opacity="0" transform="translate(330 540)">
   <rect width="88" height="112" rx="12" fill="#f9ffff" stroke="#8bc9c1" stroke-width="4"/>
   <path d="M15 25h58M15 43h58" stroke="#a9d8d1" stroke-width="5" stroke-linecap="round"/>
   <g fill="#fff" stroke="#0c938e" stroke-width="3"><rect x="15" y="61" width="22" height="32" rx="11"/><rect x="48" y="61" width="22" height="32" rx="11"/></g>
  </g>
  <g id="time-card" opacity="0" transform="translate(1050 280)">
   <rect width="190" height="72" rx="18" fill="#fff" opacity=".92"/>
   <circle cx="37" cy="36" r="17" fill="#f5a34d"/>
   <path d="M37 25v12l9 6" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
   <text x="68" y="43" font-family="DM Sans, sans-serif" font-size="19" font-weight="700" fill="#276c69">A few days later</text>
  </g>
 </g>

 <!-- Microscopic world behind camera zoom -->
 <g id="micro-world">
  <rect width="1440" height="900" fill="url(#blood)"/>
  <g opacity=".18" fill="#fa7f83">
   <ellipse cx="180" cy="190" rx="75" ry="34" transform="rotate(28 180 190)"/>
   <ellipse cx="1180" cy="190" rx="90" ry="40" transform="rotate(-25 1180 190)"/>
   <ellipse cx="220" cy="740" rx="90" ry="40" transform="rotate(-20 220 740)"/>
   <ellipse cx="1200" cy="710" rx="78" ry="35" transform="rotate(22 1200 710)"/>
  </g>
  <g fill="#7bcac1" opacity=".3">
   <circle cx="170" cy="430" r="7"/><circle cx="1180" cy="470" r="9"/><circle cx="990" cy="140" r="6"/>
   <circle cx="400" cy="770" r="5"/><circle cx="1300" cy="580" r="7"/>
  </g>
  <text x="720" y="90" fill="#d9f4ed" text-anchor="middle" font-family="DM Sans,sans-serif" font-size="23" letter-spacing="5" opacity=".7">INSIDE THE BODY</text>
 </g>

 <!-- Bacteria -->
 <g id="bacteria-group">
  <g class="bacterium" transform="translate(310 350)">
   <rect x="-72" y="-35" width="144" height="70" rx="35" fill="#79d0b2" stroke="#b7f1dc" stroke-width="8"/>
   <path d="M-39-5q18-30 36 0t38 0" fill="none" stroke="#327f77" stroke-width="5"/>
   <circle cx="-18" cy="15" r="5" fill="#276d69"/><circle cx="35" cy="-13" r="5" fill="#276d69"/>
   <path d="M-68-35l-30-20m166 95 28 18" stroke="#8ddbc2" stroke-width="5" stroke-linecap="round"/>
  </g>
  <g class="bacterium" transform="translate(560 560) rotate(-20)">
   <rect x="-75" y="-36" width="150" height="72" rx="36" fill="#79d0b2" stroke="#b7f1dc" stroke-width="8"/>
   <path d="M-40 0q20-32 40 0t40 0" fill="none" stroke="#327f77" stroke-width="5"/>
   <circle cx="-18" cy="15" r="5" fill="#276d69"/><circle cx="35" cy="-13" r="5" fill="#276d69"/>
  </g>
  <g class="bacterium" transform="translate(950 355) rotate(18)">
   <rect x="-73" y="-35" width="146" height="70" rx="35" fill="#79d0b2" stroke="#b7f1dc" stroke-width="8"/>
   <path d="M-40 0q20-32 40 0t40 0" fill="none" stroke="#327f77" stroke-width="5"/>
   <circle cx="-18" cy="15" r="5" fill="#276d69"/><circle cx="35" cy="-13" r="5" fill="#276d69"/>
  </g>
  <g id="susceptible" transform="translate(800 590)">
   <rect x="-88" y="-42" width="176" height="84" rx="42" fill="#79d0b2" stroke="#b7f1dc" stroke-width="9"/>
   <path d="M-48 0q24-40 48 0t48 0" fill="none" stroke="#327f77" stroke-width="6"/>
   <circle cx="-20" cy="17" r="6" fill="#276d69"/><circle cx="40" cy="-16" r="6" fill="#276d69"/>
   <text x="0" y="75" text-anchor="middle" fill="#d9f4ed" font-size="17" font-family="DM Sans,sans-serif">usual target</text>
  </g>
  <g id="resistant" transform="translate(1110 565)">
   <path d="M-88-24q-8-46 38-58l92-5q54 4 58 53l-4 55q-10 49-58 50h-75q-52-6-51-54z" fill="#f5a34d" stroke="#ffd39d" stroke-width="10"/>
   <path class="target-mark" d="M-40-12l18-28 20 31 22-30 20 29" fill="none" stroke="#8c4f37" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
   <circle cx="-34" cy="28" r="6" fill="#8c4f37"/><circle cx="39" cy="25" r="6" fill="#8c4f37"/>
   <text x="0" y="80" text-anchor="middle" fill="#ffe6c4" font-size="17" font-family="DM Sans,sans-serif">altered target</text>
  </g>
  <g id="antibiotic-dots">
   <g class="antibiotic" fill="#f7ffff" stroke="#75d4ca" stroke-width="4">
    <circle cx="420" cy="235" r="19"/><circle cx="710" cy="290" r="17"/><circle cx="1000" cy="220" r="18"/>
    <circle cx="680" cy="735" r="16"/><circle cx="1260" cy="380" r="18"/>
   </g>
   <g fill="#178d88"><path d="M410 235h20M710 280v20M990 220h20M670 735h20M1260 370v20" stroke="#178d88" stroke-width="4" stroke-linecap="round"/></g>
  </g>
  <g id="selection-overlay">
   <path d="M790 500l10 20 20-10" fill="none" stroke="#ffb7a4" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
   <path d="M1090 470l18 18 33-40" fill="none" stroke="#f5a34d" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
 </g>

 <!-- Clinic end-state -->
 <g id="clinic">
  <rect x="0" y="0" width="1440" height="900" fill="#d9efea"/>
  <rect x="0" y="0" width="1440" height="500" fill="#c2e8e2"/>
  <rect x="90" y="90" width="380" height="280" rx="24" fill="#effaf7"/>
  <rect x="980" y="100" width="300" height="350" rx="24" fill="#effaf7"/>
  <rect x="1020" y="150" width="220" height="80" rx="12" fill="#078b85" opacity=".15"/>
  <path d="M1060 190h140" stroke="#078b85" stroke-width="10" stroke-linecap="round"/>
  <text x="1110" y="280" text-anchor="middle" fill="#287773" font-size="24" font-family="DM Sans,sans-serif">HEALTHCARE</text>
  <g transform="translate(1000 550)">
   <rect width="220" height="125" rx="18" fill="#fff" stroke="#91cfc4" stroke-width="5"/>
   <path d="M35 36h150M35 62h100" stroke="#b7dcd5" stroke-width="8" stroke-linecap="round"/>
   <circle cx="180" cy="94" r="12" fill="#f5a34d"/>
  </g>
  <g id="resistant-result" transform="translate(650 150)">
   <rect width="300" height="92" rx="20" fill="#fff"/>
   <circle cx="48" cy="46" r="22" fill="#f5a34d"/>
   <path d="M38 46l8 8 15-18" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round"/>
   <text x="88" y="55" fill="#276c69" font-family="DM Sans,sans-serif" font-size="21" font-weight="700">Treatment may fail</text>
  </g>
 </g>
</g>
</svg>