<!-- Tablet held above the palm -->
<g id="pill" transform="translate(535 286) rotate(22)">
 <rect x="-15" y="-34" width="31" height="68" rx="15.5" fill="#fff"/>
 <path d="M-14 0h28" stroke="#168d88" stroke-width="4"/>
 <path d="M-15-15a15 15 0 0 1 30 0v15h-30z" fill="#f8ffff"/>
