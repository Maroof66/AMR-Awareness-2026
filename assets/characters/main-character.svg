  <linearGradient id="jacket" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#078d89"/><stop offset="1" stop-color="#006f72"/></linearGradient>
  <linearGradient id="top" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#43c3bb"/><stop offset="1" stop-color="#2caeaa"/></linearGradient>
</defs>

<!-- Back hair -->
