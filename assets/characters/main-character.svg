<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 900" role="img" aria-labelledby="title desc">
<title id="title">Woman holding a tablet and a glass of water</title>
<desc id="desc">A friendly flat-vector healthcare illustration in teal and coral tones.</desc>
<defs>
